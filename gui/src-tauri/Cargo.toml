[package]
name = "nicewatch-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tauri v2 GUI for Nicewatch (binary: nicewatch-gui)"

[[bin]]
name = "nicewatch-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
nicewatch-common = { path = "../../common" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
log = "0.4"
env_logger = "0.11"
