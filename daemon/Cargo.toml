[package]
name = "nicewatch-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Headless priority daemon (binary: nicewatch)"

[[bin]]
name = "nicewatch"
path = "src/main.rs"

[dependencies]
nicewatch-common = { path = "../common" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
notify = "8"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
ctrlc = { version = "3", features = ["termination"] }

[dev-dependencies]
tempfile = "3"